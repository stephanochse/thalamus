name: weekly-sync

# Every Monday the runner pulls every public leaderboard, re-scores every model for every job
# and commits the new routes. Runs in GitHub's cloud, so it happens whether or not your
# computer is on. Your own machine pulls the result (or triggers this run if it's overdue).

on:
  schedule:
    - cron: "23 5 * * 1"   # Monday 05:23 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sources to refresh (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  issues: read      # community verdicts are filed as issues

concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (v4 / v5 / v4) so a moved tag can't change what runs here.
      # The write token is not left in .git/config while the build parses third-party files; only the
      # final push step gets it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install the one sync-only dependency (reads Arena's parquet files)
        run: pip install "pyarrow==26.0.0"

      # Raw snapshots stay out of git (some sources don't allow redistribution). The cache keeps last
      # week's copy so a source that's down this week falls back instead of vanishing.
      - name: Restore last week's raw snapshots
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: data/cache
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      # Anyone can file a "Model verdict" issue. Only counts per job and model are stored, never names or
      # notes, and a model needs 5 different people before its score moves (by 10% at most).
      - name: Read community verdicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m thalamus community ingest --repo "$GITHUB_REPOSITORY" --out data/community.json || echo "Community verdicts unavailable this week; last week's counts stay."

      - name: Pull leaderboards and rebuild routes
        # The manual input goes through an env var and a whitelist, never straight into the shell.
        # Only licence-clean sources run here; Artificial Analysis and other opt-in sources are for
        # personal builds on your own machine (see docs/SOURCES.md).
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            case "$ONLY" in
              *[!a-z_,]*) echo "Invalid source list: use names like arena,epoch"; exit 1 ;;
            esac
            python -m thalamus update --only "$ONLY"
          else
            python -m thalamus update
          fi

      - name: Sanity check the output
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("data/routes.json", encoding="utf-8"))
          ranked = sum(1 for j in r["jobs"].values() if j["ranked"])
          ok = [k for k, s in r["sources"].items() if s.get("ok")]
          print(f"jobs with rankings: {ranked}/{len(r['jobs'])}, sources ok: {ok}")
          for k, s in r["sources"].items():
              if s.get("partial"):
                  print(f"note: {k} used last week's copy for: {s['partial']}")
          if "openrouter" not in ok:
              sys.exit("OpenRouter catalog is not fresh; refusing to commit.")
          if len(ok) < 3:
              sys.exit("Fewer than 3 sources fresh; refusing to commit a degraded week.")
          if ranked < len(r["jobs"]) // 2:
              sys.exit("Too few jobs ranked; refusing to commit a broken week.")
          import os, re
          import xml.etree.ElementTree as ET
          for f in ("assets/brain-map-light.svg", "assets/brain-map-dark.svg"):
              if not os.path.exists(f) or os.path.getsize(f) > 100_000:
                  sys.exit(f"{f} is missing or too large; refusing to commit.")
              ET.parse(f)  # a broken SVG shows as a broken image in the README
          for f in ("README.md", "AGENTS.md"):
              text = open(f, encoding="utf-8").read()
              for name in set(re.findall(r"<!-- thalamus:([a-z]+):start -->", text)):
                  if text.count(f"<!-- thalamus:{name}:start -->") != 1 or text.count(f"<!-- thalamus:{name}:end -->") != 1:
                      sys.exit(f"{f}: the '{name}' block markers are broken; refusing to commit.")
              if text.count("<!--") != text.count("-->"):
                  sys.exit(f"{f}: unbalanced comment markers; refusing to commit.")
          b = json.load(open("data/brain.json", encoding="utf-8"))
          for src, why in b.get("quarantined", {}).items():
              print(f"quarantined this week: {src}: {why}")
          PY

      - name: Commit the week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "weekly-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data ROUTES.md README.md AGENTS.md CHANGELOG.md BRAIN.md assets
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "data: weekly sync $(date -u +%F)"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
